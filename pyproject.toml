[project]
name = "cooperative-go2"
version = "0.1.0"
description = "Genesis と ROS 2 で四足歩行ロボット Go2 が箱を押して通路を開ける強化学習プロジェクト"
readme = "README.md"
# ROS 2 Jazzy の rclpy が apt のシステム Python 3.12 向けにビルドされるため、同じ版に揃える
requires-python = ">=3.12,<3.13"
dependencies = [
    # 録画した評価動画を読み戻して検証する
    "av",
    # Genesis の公式 examples/locomotion はこの版のタグと組で使うため完全一致で固定する
    "genesis-world==1.4.5",
    # 学習・シーンの設定ファイル（configs/*.yaml）を読み込む
    "pyyaml",
    "rsl-rl-lib>=5.0.0,<6",
    "tensorboard",
    # RSL-RL の環境インターフェースが観測を TensorDict で受け渡す
    "tensordict",
    "torch==2.15.0",
]

[project.scripts]
go2-train-gait = "cooperative_go2.frameworks.train_gait:main"
go2-evaluate-gait = "cooperative_go2.frameworks.evaluate_gait:main"
go2-evaluate-push = "cooperative_go2.frameworks.evaluate_push:main"
go2-train-push = "cooperative_go2.frameworks.train_push:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cooperative_go2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# uv 管理の Python を落とさず、rclpy と共存できるシステム Python を使う
python-preference = "only-system"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

# RTX 2080 Ti (sm_75) を含む CUDA 13.2 ビルド。torch 以外はこの index から取得しない
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
