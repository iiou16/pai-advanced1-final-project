# ROS 2 を経由した 1 台の箱押し（P3）の設定。シミュレーション・歩行方策・高レベル方策の 3 ノードが読む。
# すべてのキーが必須。読み込み時に過不足・型・値の範囲を検証する。

# 箱押しの設定（配置・成功判定・終了条件・指令の範囲・固定した歩行方策・シーン）。学習済みの方策と同じ条件にする
push_config: configs/push_single_wide.yaml

# 学習済みの高レベル方策。観測・指令の範囲・周期・歩行方策が push_config と一致しなければ読み込み時に止まる
push_policy:
  run_dir: outputs/push/push-stage2-wide60
  checkpoint: 200

# 受け手が指令を古いとみなすまでの時間 [s]（シミュレーション時間）。超えたら停止の指令に切り替える（要件 5.5）
command_expiry:
  # 高レベル方策は 0.1 s ごとに指令を出す
  velocity_command_s: 0.3
  # 歩行方策は 0.02 s ごとに目標を出し、学習時と同じく 1 周期遅れ（0.02 s）で適用する
  joint_target_s: 0.1

runtime:
  max_real_time_factor: 1.0
  startup_timeout_s: 120.0
  reply_timeout_s: 10.0
