# シーン S1_push（平面 ＋ Go2 ×1 ＋ 軽量の箱）の設定。
# 床とロボットの物理条件（制御周期・サブステップ・PD ゲイン・初期姿勢・摩擦）は、歩行方策を学習したときの
# 条件（configs/gait.yaml と Genesis の既定値）をそのまま使うため、ここには書かない。
# 箱の寸法・質量・摩擦は仮の値で、規則ベースで押す実験で調整して確定する。
# すべてのキーが必須。読み込み時に過不足・型・値の範囲を検証する。

box:
  # Go2 の胴体の前面（高さ 0.2〜0.4 m 付近）が当たる高さにする
  size_m: [0.4, 0.4, 0.3]
  mass_kg: 2.0
  # 床の摩擦は歩行の学習時と同じ Genesis の既定値 1.0 のままにする。接触する 2 面の摩擦は大きい方が使われるため、
  # 箱と床の間の摩擦は 1.0 になる。箱の滑りやすさは質量で調整する
  friction: 1.0
  # Go2（原点）の前方。Go2 の前端（x ≈ 0.35 m）と箱の後面（x = 0.8 m）の間をあける
  initial_xy_m: [1.0, 0.0]

genesis:
  # 1 台の歩行の 20 に、箱と床・箱と Go2 の衝突候補の分を足す。超えると物理ステップで止まる
  max_collision_pairs: 40
  # 摩擦円錐のモデル。Genesis の既定の pyramidal（角錐による近似）では、滑っている箱に床から押し上げる誤った力が生じ、
  # 箱が浮く・跳ねる（Go2 が押す程度の速さでも 1 cm 以上浮き、強く押すと飛んで転がる）。elliptic ではこれが起きない。
  # シーン全体に効き Go2 の足の摩擦の計算も変わる。歩行方策は pyramidal で学習したものだが、elliptic でも
  # 要件 2.3 の合格基準（追従誤差・転倒率）を満たすことを、同じチェックポイント・評価シナリオで確かめている
  friction_cone: elliptic
