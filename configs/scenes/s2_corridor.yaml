# シーン S2_corridor（壁で挟んだ通路 ＋ 通路をふさぐ箱 ＋ 退避領域 ＋ Go2 ×1）の設定。
# 1 台で箱を通路の出口の先の退避領域へ押し出し、通路を開通させる。2 台のシーン（s3_team.yaml）と配置をそろえ、
# 違いは箱の質量と、ロボット（台数・横の位置）と、それに伴う衝突候補の上限だけにする。
# 床とロボットの物理条件（制御周期・サブステップ・PD ゲイン・初期の高さと姿勢・摩擦）は、歩行方策を学習したときの
# 条件（configs/gait.yaml と Genesis の既定値）をそのまま使うため、ここには書かない。
# すべてのキーが必須。読み込み時に過不足・型・値の範囲を検証する。

box:
  # 奥行き (x) × 幅 (y) × 高さ (z)。2 台の Go2 が 0.5 m 間隔で横に並んで押せる幅にする
  size_m: [0.4, 1.0, 0.3]
  # 1 台で押せる軽い箱（1 台の箱押しのシーン S1_push の箱と同じ質量）
  mass_kg: 2.0
  # 床の摩擦（歩行の学習時の Genesis の既定値 1.0）と同じ。接触する 2 面の摩擦は大きい方が使われるため、これより下げられない
  friction: 1.0
  # 通路の中（x = 1.2〜1.6 m）に置く
  initial_xy_m: [1.4, 0.0]

corridor:
  entrance_x_m: 1.0
  exit_x_m: 2.0
  center_y_m: 0.0
  # 箱（幅 1.0 m）の両側のすき間 0.2 m は Go2 の胴体の幅（約 0.31 m）より狭く、箱を動かさなければ通れない。
  # 2 台が並んだ幅（±0.405 m）と押している間の横ずれ（約 0.1 m）が壁に当たらない広さにする
  width_m: 1.4
  # 通行領域を入口・出口の外へ Go2 の胴体の長さ（約 0.7 m）だけ延ばす。出口のすぐ外に残った箱を開通とみなさないため
  apron_m: 0.7

walls:
  # Go2 の胴体（高さ 0.2〜0.4 m 付近）より高くし、乗り越えさせない
  height_m: 0.5
  # 壁をシーンの有効範囲の端（±4 m）まで延ばし、Go2 が壁を回り込めないようにする
  outer_half_extent_y_m: 4.0

retreat_area:
  # 通行領域の出口側の端（x = 2.7 m）から 0.5 m 以上離す。箱を入れても通行領域と重ならない
  center_xy_m: [3.6, 0.0]
  radius_m: 0.4

robots:
  # 前端（胴体の原点から約 0.35 m 前）と箱の後面の間を 0.15 m あける
  - name: go2_a
    initial_xy_m: [0.7, 0.0]

genesis:
  # 1 台と箱の 40（S1_push）に、Go2 と壁・箱と壁の衝突候補の分を足す。超えると物理ステップで止まる
  max_collision_pairs: 60
  # 箱を置くシーンと同じく elliptic にする（pyramidal では滑る箱が浮く）
  friction_cone: elliptic
